<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <title>AI 简历助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./tailwind.js"></script>
    <script src="./vue3.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* 自定义滚动条 - 极简 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a3a3a3; }

        /* 输入框自适应高度 */
        textarea { field-sizing: content; }

        /* 减少动画 */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body class="min-h-screen bg-neutral-50 text-neutral-800 antialiased font-sans">
    <div id="app" class="h-screen flex justify-center overflow-hidden">

        <!-- ==================== 聊天主界面 ==================== -->
        <div v-if="isLoggedIn" class="flex w-full h-full">

            <!-- 左侧边栏 -->
            <aside class="w-60 border-r border-neutral-200 bg-neutral-50 flex flex-col shrink-0">
                <!-- 顶部：新建对话 -->
                <div class="p-4 border-b border-neutral-200">
                    <button @click="createNewChat" :disabled="hasEmptyChat"
                        class="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-medium rounded-lg transition-colors duration-200 cursor-pointer"
                        :class="hasEmptyChat
                            ? 'bg-neutral-100 text-neutral-400 cursor-not-allowed'
                            : 'bg-neutral-900 text-white hover:bg-neutral-800'"
                        :title="hasEmptyChat ? '当前存在空会话' : '创建新会话'">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                        </svg>
                        新建对话
                    </button>
                </div>

                <!-- 会话列表 -->
                <div ref="chatListRef" @scroll="handleScroll"
                    class="flex-1 overflow-y-auto py-2 px-2 space-y-0.5 custom-scrollbar">
                    <div v-for="chat in chats" :key="chat.id" @click="setActiveChat(chat.id)"
                        class="relative w-full px-3 py-2.5 text-left flex flex-col gap-0.5 rounded-lg cursor-pointer transition-colors duration-150 group"
                        :class="chat.id === activeChatId
                            ? 'bg-neutral-200/70'
                            : 'hover:bg-neutral-100'">

                        <div class="flex items-center justify-between gap-2">
                            <span class="font-medium truncate flex-1 text-sm text-neutral-700">
                                {{ chat.name }}
                            </span>
                            <!-- 删除按钮 -->
                            <button @click.stop="deleteChat(chat.id)"
                                class="opacity-0 group-hover:opacity-100 p-1 rounded text-neutral-400 hover:text-red-500 transition-opacity duration-150 cursor-pointer"
                                title="删除会话">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                    </path>
                                </svg>
                            </button>
                        </div>

                        <span class="text-xs text-neutral-400 truncate">
                            {{ chat.preview || '暂无消息' }}
                        </span>
                    </div>

                    <!-- 加载更多 -->
                    <div v-if="isLoadingMore" class="py-3 text-center">
                        <div class="inline-flex items-center gap-1">
                            <span class="h-1 w-1 rounded-full bg-neutral-300 animate-bounce"></span>
                            <span class="h-1 w-1 rounded-full bg-neutral-300 animate-bounce [animation-delay:0.15s]"></span>
                            <span class="h-1 w-1 rounded-full bg-neutral-300 animate-bounce [animation-delay:0.3s]"></span>
                        </div>
                    </div>
                    <div v-if="!hasMore && chats.length > 0" class="py-3 text-center text-xs text-neutral-300">
                        没有更多了
                    </div>
                </div>

                <!-- 底部用户信息 -->
                <div class="p-4 border-t border-neutral-200">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 min-w-0">
                            <div class="w-7 h-7 rounded-full bg-neutral-200 flex items-center justify-center text-xs font-medium text-neutral-600 shrink-0">
                                {{ (currentUsername || 'U').charAt(0).toUpperCase() }}
                            </div>
                            <span class="text-sm text-neutral-600 truncate">{{ currentUsername || currentUserId }}</span>
                        </div>
                        <button @click="logout"
                            class="text-xs text-neutral-400 hover:text-neutral-600 transition-colors duration-150 cursor-pointer whitespace-nowrap">
                            退出
                        </button>
                    </div>
                </div>
            </aside>

            <!-- 右侧主聊天区域 -->
            <div class="flex flex-col flex-1 h-full bg-white">

                <!-- 聊天内容 -->
                <main ref="chatMain"
                    class="flex-1 overflow-y-auto px-4 py-6 custom-scrollbar scroll-smooth">

                    <div class="max-w-2xl mx-auto space-y-5">
                        <template v-if="messages.length">
                            <div v-for="(m, index) in messages" :key="`msg-${index}-${m.content?.slice(0, 10)}`">

                                <!-- 用户消息 -->
                                <template v-if="m.type === 'human'">
                                    <div class="flex justify-end mb-5">
                                        <div class="max-w-[80%] bg-neutral-900 text-white px-4 py-3 rounded-2xl rounded-br-md text-sm leading-relaxed whitespace-pre-wrap break-words">
                                            {{ m.content }}
                                        </div>
                                    </div>
                                </template>

                                <!-- AI 消息 -->
                                <template v-else-if="m.type === 'ai'">
                                    <div class="flex gap-3 mb-5">
                                        <div class="w-7 h-7 rounded-full bg-neutral-100 flex items-center justify-center shrink-0 mt-0.5">
                                            <svg class="w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 00-2.455 2.456z"></path>
                                            </svg>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <!-- 工具调用标签 -->
                                            <div v-if="m.toolCalls && m.toolCalls.length" class="flex flex-wrap gap-1.5 mb-2">
                                                <div v-for="tc in m.toolCalls" :key="tc.id || tc.name"
                                                    class="inline-flex items-center gap-1 text-xs text-neutral-500 bg-neutral-50 border border-neutral-200 px-2 py-1 rounded-md">
                                                    <svg class="w-3 h-3 text-neutral-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17l-5.648-3.009A2.25 2.25 0 013 10.02V6.757a2.25 2.25 0 011.772-2.14l5.648-1.13a2.25 2.25 0 01.906 0l5.648 1.13A2.25 2.25 0 0118.75 6.757v3.263a2.25 2.25 0 01-2.772 2.141L10.35 13.17"></path>
                                                    </svg>
                                                    <span class="font-mono">{{ tc.name }}</span>
                                                    <span v-if="tc.args && Object.keys(tc.args).length"
                                                        class="font-mono text-neutral-400 truncate max-w-[120px]"
                                                        :title="JSON.stringify(tc.args)">{{ JSON.stringify(tc.args) }}</span>
                                                </div>
                                            </div>

                                            <!-- 消息文本 -->
                                            <div v-if="m.displayedContent || m.content"
                                                class="text-sm text-neutral-700 leading-relaxed whitespace-pre-wrap break-words">
                                                {{ m.displayedContent || m.content }}
                                                <span v-if="m.isThinking"
                                                    class="inline-block w-0.5 h-4 ml-0.5 align-middle animate-pulse bg-neutral-400"></span>
                                            </div>

                                            <!-- 思考中动画 -->
                                            <div v-else-if="m.isThinking" class="flex items-center gap-1 py-1">
                                                <span class="h-1.5 w-1.5 rounded-full bg-neutral-300 animate-bounce"></span>
                                                <span class="h-1.5 w-1.5 rounded-full bg-neutral-300 animate-bounce [animation-delay:0.15s]"></span>
                                                <span class="h-1.5 w-1.5 rounded-full bg-neutral-300 animate-bounce [animation-delay:0.3s]"></span>
                                            </div>
                                        </div>
                                    </div>
                                </template>

                                <!-- 工具执行结果 -->
                                <template v-else-if="m.type === 'tool'">
                                    <div class="mb-5 ml-10">
                                        <div class="text-xs border border-neutral-200 rounded-lg overflow-hidden">
                                            <div class="flex items-center justify-between px-3 py-2 bg-neutral-50 cursor-pointer select-none"
                                                @click="m.expanded = !m.expanded">
                                                <span class="flex items-center gap-1.5 text-neutral-500">
                                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17l-5.648-3.009A2.25 2.25 0 013 10.02V6.757a2.25 2.25 0 011.772-2.14l5.648-1.13a2.25 2.25 0 01.906 0l5.648 1.13A2.25 2.25 0 0118.75 6.757v3.263a2.25 2.25 0 01-2.772 2.141L10.35 13.17"></path>
                                                    </svg>
                                                    <span class="font-medium">{{ m.name }}</span>
                                                </span>
                                                <svg class="w-3 h-3 text-neutral-400 transition-transform duration-200"
                                                    :class="m.expanded ? 'rotate-180' : ''"
                                                    fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
                                                </svg>
                                            </div>
                                            <div v-if="m.expanded"
                                                class="px-3 py-2 text-neutral-600 font-mono whitespace-pre-wrap break-words border-t border-neutral-200 bg-white">
                                                {{ m.content }}
                                            </div>
                                        </div>
                                    </div>
                                </template>

                            </div>
                        </template>

                        <!-- 空状态 -->
                        <template v-else>
                            <div class="h-full flex flex-col items-center justify-center text-center py-32">
                                <div class="w-12 h-12 rounded-full bg-neutral-100 flex items-center justify-center mb-4">
                                    <svg class="w-6 h-6 text-neutral-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z">
                                        </path>
                                    </svg>
                                </div>
                                <p class="text-sm font-medium text-neutral-600 mb-1">开始新的对话</p>
                                <p class="text-xs text-neutral-400 mb-6">在下方输入你的问题</p>
                                <button @click="sayHello"
                                    class="inline-flex items-center gap-2 px-5 py-2 text-sm text-neutral-600 bg-neutral-100 rounded-lg hover:bg-neutral-200 transition-colors duration-200 cursor-pointer">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.05 4.575a1.575 1.575 0 10-3.15 0v3m3.15-3v-1.5a1.575 1.575 0 013.15 0v1.5m-3.15 0l.075 5.925m3.075.75V4.575m0 0a1.575 1.575 0 013.15 0V15M6.9 7.575a1.575 1.575 0 10-3.15 0v8.175a6.3 6.3 0 006.3 6.3h2.1a6.3 6.3 0 006.3-6.3V9.15a1.575 1.575 0 10-3.15 0v.75"></path>
                                    </svg>
                                    打个招呼
                                </button>
                            </div>
                        </template>
                    </div>
                </main>

                <!-- 输入区域 -->
                <section class="border-t border-neutral-100 bg-white px-4 py-4">
                    <div class="flex items-end gap-3 max-w-2xl mx-auto">
                        <div class="flex-1 bg-neutral-50 border border-neutral-200 rounded-xl px-4 py-3 focus-within:border-neutral-400 transition-colors duration-200">
                            <textarea v-model="input" @keydown.enter.exact.prevent="handleEnter"
                                @keydown.enter.shift.exact.stop rows="1" placeholder="输入消息..."
                                class="block w-full resize-none bg-transparent p-0 text-sm text-neutral-800 placeholder:text-neutral-400 focus:outline-none max-h-32"></textarea>
                        </div>
                        <button :disabled="!input.trim() || isThinking" @click="send"
                            class="flex items-center justify-center h-11 w-11 rounded-xl bg-neutral-900 text-white transition-all duration-200 hover:bg-neutral-800 active:scale-95 disabled:bg-neutral-200 disabled:text-neutral-400 disabled:cursor-not-allowed cursor-pointer shrink-0">
                            <span v-if="!isThinking">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5L12 3m0 0l7.5 7.5M12 3v18"></path>
                                </svg>
                            </span>
                            <span v-else>
                                <span class="h-4 w-4 animate-spin rounded-full border-2 border-neutral-400 border-t-white block"></span>
                            </span>
                        </button>
                    </div>
                </section>
            </div>
        </div>

        <!-- ==================== 登录界面 ==================== -->
        <div v-else class="flex w-full items-center justify-center px-6">
            <div class="w-full max-w-sm">
                <div class="text-center mb-10">
                    <div class="w-12 h-12 rounded-full bg-neutral-900 flex items-center justify-center mx-auto mb-5">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 00-2.455 2.456z"></path>
                        </svg>
                    </div>
                    <h1 class="text-xl font-semibold text-neutral-800">AI 简历助手</h1>
                    <p class="mt-2 text-sm text-neutral-400">登录以开始对话</p>
                </div>

                <form class="space-y-4" @submit.prevent="login">
                    <div>
                        <label for="username" class="block text-sm font-medium text-neutral-600 mb-1.5">用户名</label>
                        <input id="username" v-model="loginForm.username" type="text" required autocomplete="username"
                            class="block w-full rounded-lg border border-neutral-200 bg-neutral-50 px-3.5 py-2.5 text-sm text-neutral-800 placeholder:text-neutral-400 focus:outline-none focus:border-neutral-400 focus:bg-white transition-colors duration-200">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-neutral-600 mb-1.5">密码</label>
                        <input id="password" v-model="loginForm.password" type="password" required autocomplete="current-password"
                            class="block w-full rounded-lg border border-neutral-200 bg-neutral-50 px-3.5 py-2.5 text-sm text-neutral-800 placeholder:text-neutral-400 focus:outline-none focus:border-neutral-400 focus:bg-white transition-colors duration-200">
                    </div>

                    <div v-if="loginForm.error" class="text-red-500 text-sm text-center py-1">
                        {{ loginForm.error }}
                    </div>

                    <button type="submit" :disabled="loginForm.isLoading"
                        class="w-full rounded-lg bg-neutral-900 px-4 py-2.5 text-sm font-medium text-white hover:bg-neutral-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-900 disabled:opacity-50 transition-colors duration-200 cursor-pointer">
                        <span v-if="loginForm.isLoading">登录中...</span>
                        <span v-else>登录</span>
                    </button>

                    <p class="text-center text-xs text-neutral-400 mt-4">
                        测试账号: admin / 123456
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, reactive, nextTick, onMounted } = Vue;

        // ========== 配置常量 ==========
        const CONFIG = {
            API_URL: "/api/chat/stream",
            THREADS_API_URL: "/api/threads",
            AUTH_API_URL: "/api/auth",
            TYPEWRITER_SPEED: 20,
            SCROLL_DEBOUNCE: 100,
            TYPEWRITER_CLEANUP_DELAY: 100
        };


        createApp({
            setup() {
                // ========== 响应式状态 ==========
                const chats = ref([]);
                const activeChatId = ref("");
                const input = ref("");
                const chatMain = ref(null);
                const typewriterTimers = new Map();
                let scrollTimer = null;

                // Auth State
                const currentUserId = ref("");
                const currentUsername = ref("");
                const authToken = ref("");
                const isLoggedIn = ref(false);
                const loginForm = reactive({
                    username: "",
                    password: "",
                    isLoading: false,
                    error: ""
                });

                // 分页状态
                const page = ref(1);
                const pageSize = ref(10);
                const total = ref(0);
                const isLoadingMore = ref(false);
                const chatListRef = ref(null);

                const hasMore = computed(() => {
                    return chats.value.length < total.value;
                });

                // ========== 计算属性 ==========
                const activeChat = computed(() =>
                    chats.value.find(c => c.id === activeChatId.value) || null
                );
                const messages = computed(() =>
                    activeChat.value ? activeChat.value.messages : []
                );
                const isThinking = computed(() => {
                    if (!activeChat.value) return false;
                    return activeChat.value.messages.some(m => m.type === "ai" && m.isThinking);
                });

                const hasEmptyChat = computed(() => {
                    return chats.value.some(chat => {
                        if (chat.isEmptyFromServer !== undefined) {
                            return chat.isEmptyFromServer;
                        }
                        return chat.messages.length === 0;
                    });
                });

                function isChatEmpty(chat) {
                    if (chat.isEmptyFromServer !== undefined) {
                        return chat.isEmptyFromServer;
                    }
                    return chat.messages.length === 0;
                }

                // ========== 认证逻辑 ==========

                async function login() {
                    if (!loginForm.username || !loginForm.password) {
                        loginForm.error = "请输入用户名和密码";
                        return;
                    }

                    loginForm.isLoading = true;
                    loginForm.error = "";

                    try {
                        const response = await fetch(`${CONFIG.AUTH_API_URL}/login`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                username: loginForm.username,
                                password: loginForm.password
                            })
                        });

                        const res = await response.json();

                        if (!response.ok) {
                            throw new Error(res.detail || res.message || "登录失败");
                        }

                        if (res.code === "SUCCESS") {
                            const data = res.data;
                            authToken.value = data.access_token;
                            currentUserId.value = data.user_id;
                            currentUsername.value = data.username;
                            isLoggedIn.value = true;

                            localStorage.setItem("authToken", data.access_token);
                            localStorage.setItem("userId", data.user_id);
                            localStorage.setItem("username", data.username);

                            loginForm.password = "";

                            chats.value = [];
                            page.value = 1;
                            await loadThreads();
                        } else {
                            throw new Error(res.message);
                        }
                    } catch (err) {
                        console.error("Login error:", err);
                        loginForm.error = err.message;
                    } finally {
                        loginForm.isLoading = false;
                    }
                }

                function logout() {
                    authToken.value = "";
                    currentUserId.value = "";
                    currentUsername.value = "";
                    isLoggedIn.value = false;
                    chats.value = [];
                    activeChatId.value = "";

                    localStorage.removeItem("authToken");
                    localStorage.removeItem("userId");
                    localStorage.removeItem("username");
                }

                function getHeaders() {
                    return {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${authToken.value}`
                    };
                }

                function checkAuthError(status) {
                    if (status === 401) {
                        logout();
                        return true;
                    }
                    return false;
                }

                // ========== 工具函数 ==========
                function scrollToBottom(behavior = "auto") {
                    if (scrollTimer) {
                        clearTimeout(scrollTimer);
                    }

                    scrollTimer = setTimeout(() => {
                        nextTick(() => {
                            if (!chatMain.value) return;
                            const el = chatMain.value;
                            el.scrollTo({
                                top: el.scrollHeight,
                                behavior
                            });
                        });
                    }, behavior === "smooth" ? CONFIG.SCROLL_DEBOUNCE : 0);
                }

                function startTypewriter(msg, speed = CONFIG.TYPEWRITER_SPEED) {
                    if (!msg.displayedContent) {
                        msg.displayedContent = "";
                    }

                    if (typewriterTimers.has(msg)) {
                        return;
                    }

                    if (msg.content.length > 0 && msg.displayedContent.length === 0) {
                        msg.displayedContent = msg.content.substring(0, 1);
                        scrollToBottom("smooth");
                    }

                    const timer = setInterval(() => {
                        if (msg.displayedContent.length < msg.content.length) {
                            msg.displayedContent = msg.content.substring(0, msg.displayedContent.length + 1);
                            scrollToBottom("smooth");
                        } else if (!msg.isThinking) {
                            clearInterval(timer);
                            typewriterTimers.delete(msg);
                        }
                    }, speed);

                    typewriterTimers.set(msg, timer);
                }

                function stopTypewriter(msg) {
                    if (typewriterTimers.has(msg)) {
                        clearInterval(typewriterTimers.get(msg));
                        typewriterTimers.delete(msg);
                    }
                    if (msg.displayedContent.length < msg.content.length) {
                        msg.displayedContent = msg.content;
                    }
                }

                // ========== 事件处理函数 ==========
                function handleEnter() {
                    if (!input.value.trim()) return;
                    send();
                }

                async function setActiveChat(chatId) {
                    if (activeChatId.value === chatId) return;
                    activeChatId.value = chatId;

                    const chat = chats.value.find(c => c.id === chatId);
                    if (chat && chat.messages.length === 0) {
                        await loadThreadHistory(chat.threadId);
                    }

                    scrollToBottom("auto");
                }

                async function createNewChat() {
                    if (hasEmptyChat.value) {
                        const emptyChat = chats.value.find(chat => chat.messages.length === 0);
                        if (emptyChat) {
                            activeChatId.value = emptyChat.id;
                            return;
                        }
                    }

                    try {
                        const response = await fetch(CONFIG.THREADS_API_URL, {
                            method: "POST",
                            headers: getHeaders(),
                            body: JSON.stringify({})
                        });

                        if (checkAuthError(response.status)) return;

                        if (!response.ok) {
                            throw new Error(`创建会话失败: ${response.statusText}`);
                        }

                        const res = await response.json();
                        if (res.code !== "SUCCESS") {
                            throw new Error(res.message);
                        }
                        const thread = res.data.thread;

                        chats.value.unshift({
                            id: thread.id,
                            name: thread.title || `会话 ${thread.id.slice(0, 8)}`,
                            userId: thread.user_id,
                            threadId: thread.id,
                            preview: thread.preview || '暂无消息',
                            messages: []
                        });

                        activeChatId.value = thread.id;
                        input.value = "";
                        scrollToBottom("auto");
                    } catch (err) {
                        console.error('创建会话失败:', err);
                        alert(`创建会话失败: ${err.message}`);
                    }
                }

                function handleStreamResponse(reader, assistantMsg) {
                    const decoder = new TextDecoder("utf-8");
                    let buffer = "";

                    function read() {
                        reader.read()
                            .then(({ done, value }) => {
                                if (done) {
                                    assistantMsg.isThinking = false;
                                    if (assistantMsg.displayedContent.length < assistantMsg.content.length) {
                                        startTypewriter(assistantMsg);
                                    }
                                    setTimeout(() => {
                                        stopTypewriter(assistantMsg);
                                    }, CONFIG.TYPEWRITER_CLEANUP_DELAY);
                                    scrollToBottom("smooth");
                                    return;
                                }

                                buffer += decoder.decode(value, { stream: true });
                                const chunks = buffer.split("\n\n");
                                buffer = chunks.pop() || "";

                                chunks.forEach(chunk => {
                                    parseSSEData(chunk, assistantMsg);
                                });

                                read();
                            })
                            .catch(err => {
                                handleError(err, assistantMsg, "读取流失败");
                            });
                    }

                    read();
                }

                function parseSSEData(chunk, assistantMsg) {
                    const trimmed = chunk.trim();
                    if (!trimmed || !trimmed.startsWith("data: ")) return;

                    try {
                        const jsonStr = trimmed.replace("data: ", "");
                        const data = JSON.parse(jsonStr);

                        if (data.tool_calls && data.tool_calls.length > 0) {
                            const chat = activeChat.value;
                            if (chat) {
                                data.tool_calls.forEach(tc => {
                                    const exists = chat.messages.some(
                                        m => m.type === "ai" && m.toolCalls &&
                                            m.toolCalls.some(existingTc => existingTc.id === tc.id)
                                    );
                                    if (!exists) {
                                        const toolCallMsg = reactive({
                                            type: "ai",
                                            content: "",
                                            displayedContent: "",
                                            isThinking: false,
                                            toolCalls: [tc]
                                        });
                                        const msgIndex = chat.messages.indexOf(assistantMsg);
                                        if (msgIndex > 0) {
                                            chat.messages.splice(msgIndex, 0, toolCallMsg);
                                        } else {
                                            chat.messages.push(toolCallMsg);
                                        }
                                    }
                                });
                                scrollToBottom("smooth");
                            }
                        }

                        if (data.type === "tool_result") {
                            const toolMsg = reactive({
                                type: "tool",
                                name: data.name || "unknown",
                                content: data.content || "",
                                toolCallId: data.tool_call_id || "",
                                expanded: false
                            });
                            const chat = activeChat.value;
                            if (chat) {
                                const msgIndex = chat.messages.indexOf(assistantMsg);
                                if (msgIndex > 0) {
                                    chat.messages.splice(msgIndex, 0, toolMsg);
                                } else {
                                    chat.messages.push(toolMsg);
                                }
                            }
                            scrollToBottom("smooth");
                            return;
                        }

                        if (data.content !== undefined && data.type !== "tool_result") {
                            let content = data.content;
                            if (!assistantMsg.content) {
                                content = content.replace(/^\n+/, '');
                            }
                            assistantMsg.content += content;
                            if (!typewriterTimers.has(assistantMsg)) {
                                startTypewriter(assistantMsg);
                            }
                        }
                    } catch (e) {
                        console.error("解析 SSE 数据失败:", e, "原始数据:", trimmed);
                    }
                }

                function handleError(err, assistantMsg, message) {
                    console.error(message, err);
                    assistantMsg.isThinking = false;
                    stopTypewriter(assistantMsg);

                    if (!assistantMsg.content) {
                        assistantMsg.content = "抱歉，发生了错误，请稍后重试。";
                        assistantMsg.displayedContent = assistantMsg.content;
                    }

                    scrollToBottom("smooth");
                }

                function sayHello() {
                    if (isThinking.value) return;
                    input.value = "你好";
                    send();
                }

                function send() {
                    const userMessage = input.value.trim();
                    if (!userMessage || isThinking.value) return;

                    if (!activeChat.value) {
                        console.warn("当前没有选中的会话，无法发送消息");
                        return;
                    }

                    activeChat.value.messages.push({
                        type: "human",
                        content: userMessage
                    });
                    activeChat.value.isEmptyFromServer = false;
                    input.value = "";
                    scrollToBottom();

                    const assistantMsg = reactive({
                        type: "ai",
                        content: "",
                        displayedContent: "",
                        isThinking: true
                    });
                    activeChat.value.messages.push(assistantMsg);
                    scrollToBottom();

                    fetch(CONFIG.API_URL, {
                        method: "POST",
                        headers: getHeaders(),
                        body: JSON.stringify({
                            thread_id: activeChat.value.threadId,
                            message: userMessage
                        })
                    })
                        .then(response => {
                            if (checkAuthError(response.status)) {
                                throw new Error("Authentication failed");
                            }
                            if (!response.ok) {
                                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                            }
                            if (!response.body) {
                                throw new Error("响应体为空");
                            }
                            return response.body.getReader();
                        })
                        .then(reader => {
                            handleStreamResponse(reader, assistantMsg);
                        })
                        .catch(err => {
                            handleError(err, assistantMsg, "请求失败");
                        });
                }

                // ========== 生命周期 ==========
                async function loadThreads(isAppend = false) {
                    if (isLoadingMore.value) return;

                    isLoadingMore.value = true;
                    try {
                        const response = await fetch(`${CONFIG.THREADS_API_URL}?page=${page.value}&page_size=${pageSize.value}`, {
                            headers: getHeaders()
                        });

                        if (checkAuthError(response.status)) return;

                        if (!response.ok) {
                            const errText = await response.text();
                            console.error('加载会话列表失败:', response.statusText, errText);
                            try {
                                const errJson = JSON.parse(errText);
                                if (errJson.detail) throw new Error(errJson.detail);
                            } catch (e) {
                                // ignore
                            }
                            throw new Error(response.statusText);
                        }

                        const res = await response.json();
                        if (res.code !== "SUCCESS") {
                            console.error('加载会话列表失败:', res.message);
                            alert(`加载会话列表失败: ${res.message}`);
                            return;
                        }
                        const data = res.data;

                        if (data.total !== undefined) {
                            total.value = data.total;
                        }

                        if (data.threads && data.threads.length > 0) {
                            const newThreads = data.threads.map((t, index) => ({
                                id: t.id,
                                name: t.title || `会话 ${t.id.slice(0, 8)}`,
                                userId: t.user_id,
                                threadId: t.id,
                                preview: t.preview || '暂无消息',
                                isEmptyFromServer: t.is_empty,
                                messages: []
                            }));

                            if (isAppend) {
                                chats.value.push(...newThreads);
                            } else {
                                chats.value = newThreads;
                                const currentChatStillExists = chats.value.find(c => c.id === activeChatId.value);
                                if (chats.value.length > 0 && !currentChatStillExists) {
                                    activeChatId.value = chats.value[0].id;
                                    await loadThreadHistory(chats.value[0].threadId);
                                }
                            }
                        } else {
                            if (page.value === 1 && !isAppend) {
                                await createNewChat();
                            }
                        }
                    } catch (err) {
                        console.error('加载会话列表出错:', err);
                        if (page.value === 1 && !isAppend) {
                            await createNewChat();
                        }
                    } finally {
                        isLoadingMore.value = false;
                    }
                }

                const handleScroll = () => {
                    const el = chatListRef.value;
                    if (!el) return;

                    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 50) {
                        if (hasMore.value && !isLoadingMore.value) {
                            page.value++;
                            loadThreads(true);
                        }
                    }
                };

                async function loadThreadHistory(threadId) {
                    if (!threadId) return;

                    try {
                        const response = await fetch(
                            `${CONFIG.THREADS_API_URL}/${encodeURIComponent(threadId)}/history`, {
                            headers: getHeaders()
                        }
                        );

                        if (checkAuthError(response.status)) return;
                        if (!response.ok) {
                            const errText = await response.text();
                            console.error('加载历史消息失败:', response.statusText, errText);
                            try {
                                const errJson = JSON.parse(errText);
                                if (errJson.detail) throw new Error(errJson.detail);
                            } catch (e) {
                                // ignore
                            }
                            throw new Error(response.statusText || '加载历史消息失败');
                        }

                        const res = await response.json();
                        if (res.code !== "SUCCESS") {
                            console.error('加载历史消息失败:', res.message);
                            alert(`加载历史消息失败: ${res.message}`);
                            return;
                        }
                        const data = res.data;
                        const chat = chats.value.find(c => c.threadId === threadId);
                        if (chat && data.messages) {
                            chat.messages = data.messages.map(m => {
                                const cleanContent = (m.content || '').replace(/^\n+/, '');
                                return {
                                    type: m.type,
                                    content: cleanContent,
                                    displayedContent: cleanContent,
                                    name: m.name,
                                    toolCalls: m.tool_calls,
                                    toolCallId: m.tool_call_id,
                                    id: m.id,
                                    expanded: false
                                };
                            });

                            if (chat.messages.length > 0) {
                                const lastMsg = chat.messages[chat.messages.length - 1];
                                chat.preview = lastMsg.content.slice(0, 50) + (lastMsg.content.length > 50 ? '...' : '');
                            }

                            scrollToBottom('auto');
                        }
                    } catch (err) {
                        console.error('加载历史消息出错:', err);
                        alert(`加载历史消息出错: ${err.message}`);
                    }
                }

                async function deleteChat(chatId) {
                    if (!confirm('确定要删除这个会话吗？')) return;

                    try {
                        const response = await fetch(`${CONFIG.THREADS_API_URL}/${chatId}`, {
                            method: "DELETE",
                            headers: getHeaders()
                        });

                        if (checkAuthError(response.status)) return;

                        const res = await response.json();
                        if (res.code !== "SUCCESS") {
                            throw new Error(`删除失败: ${res.message}`);
                        }

                        const index = chats.value.findIndex(c => c.id === chatId);
                        if (index > -1) {
                            chats.value.splice(index, 1);
                        }

                        if (activeChatId.value === chatId) {
                            if (chats.value.length > 0) {
                                activeChatId.value = chats.value[0].id;
                                await loadThreadHistory(chats.value[0].threadId);
                            } else {
                                await createNewChat();
                            }
                        }
                    } catch (err) {
                        console.error('删除会话失败:', err);
                        alert('删除失败，请重试');
                    }
                }

                onMounted(async () => {
                    const savedToken = localStorage.getItem("authToken");
                    const savedUserId = localStorage.getItem("userId");
                    const savedUsername = localStorage.getItem("username");

                    if (savedToken && savedUserId) {
                        authToken.value = savedToken;
                        currentUserId.value = savedUserId;
                        currentUsername.value = savedUsername || "";
                        isLoggedIn.value = true;

                        await loadThreads();
                    }
                });

                return {
                    chats,
                    activeChatId,
                    activeChat,
                    messages,
                    input,
                    sayHello,
                    isThinking,
                    hasEmptyChat,
                    chatMain,
                    currentUserId,
                    currentUsername,
                    isLoggedIn,
                    loginForm,
                    login,
                    logout,
                    send,
                    handleEnter,
                    setActiveChat,
                    createNewChat,
                    deleteChat,
                    isLoadingMore,
                    hasMore,
                    chatListRef,
                    handleScroll,
                    isChatEmpty,
                    page,
                    pageSize,
                    total
                };
            }
        }).mount("#app");
    </script>
</body>
